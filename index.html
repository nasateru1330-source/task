<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - スマートタスク管理</title>

    <!-- Favicon (404エラー防止インラインSVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☑️</text></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .task-card {
            transition: all 0.2s ease-in-out;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- App Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-check-double text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">TaskFlow</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">ローカル自動保存タスク管理</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Backup & Restore Buttons -->
                <button id="export-btn" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-1.5" title="JSON形式で保存">
                    <i class="fa-solid fa-download text-slate-500"></i>
                    <span class="hidden sm:inline">書き出し</span>
                </button>
                <label id="import-label" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center gap-1.5 cursor-pointer" title="JSONファイルから復元">
                    <i class="fa-solid fa-upload text-slate-500"></i>
                    <span class="hidden sm:inline">読み込み</span>
                    <input type="file" id="import-input" accept=".json" class="hidden">
                </label>
                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                <span class="text-xs font-medium text-emerald-600 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-full flex items-center gap-1">
                    <i class="fa-solid fa-hard-drive"></i>
                    <span>保存済み</span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="space-y-8">
            <!-- Stats Cards Section -->
            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Total Tasks -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">総タスク数</p>
                        <h3 id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </div>
                </div>

                <!-- Active Tasks -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">未完了タスク</p>
                        <h3 id="stat-active" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                        <i class="fa-solid fa-hourglass-half text-xl"></i>
                    </div>
                </div>

                <!-- Completed Tasks -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">完了済み</p>
                        <h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-solid fa-circle-check text-xl"></i>
                    </div>
                </div>

                <!-- Progress Bar Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">達成率</p>
                        <span id="stat-rate-text" class="text-xs font-bold text-brand-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div id="stat-rate-bar" class="bg-gradient-to-r from-brand-500 to-indigo-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Left Column: Create Task Form -->
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm sticky top-24">
                        <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-plus-circle text-brand-600"></i> 新しいタスクを追加
                        </h3>
                        <form id="add-task-form" class="space-y-4">
                            <div>
                                <label for="task-title" class="block text-xs font-semibold text-slate-600 mb-1">タイトル <span class="text-red-500">*</span></label>
                                <input type="text" id="task-title" required placeholder="例: レポートの提出" 
                                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                            </div>

                            <div>
                                <label for="task-desc" class="block text-xs font-semibold text-slate-600 mb-1">詳細メモ (任意)</label>
                                <textarea id="task-desc" rows="3" placeholder="タスクに関する詳細メモ..." 
                                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition resize-none"></textarea>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label for="task-priority" class="block text-xs font-semibold text-slate-600 mb-1">優先度</label>
                                    <select id="task-priority" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                                        <option value="low">低 (Low)</option>
                                        <option value="medium" selected>中 (Medium)</option>
                                        <option value="high">高 (High)</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="task-category" class="block text-xs font-semibold text-slate-600 mb-1">カテゴリ</label>
                                    <select id="task-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                                        <option value="work">仕事</option>
                                        <option value="personal" selected>個人</option>
                                        <option value="study">学習</option>
                                        <option value="shopping">買い物</option>
                                        <option value="health">健康・運動</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="task-duedate" class="block text-xs font-semibold text-slate-600 mb-1">期限日</label>
                                <input type="date" id="task-duedate" 
                                    class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                            </div>

                            <button type="submit" id="submit-task-btn" 
                                class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
                                <i class="fa-solid fa-plus"></i> タスクを作成
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right Column: Task List & Filter Toolbar -->
                <div class="lg:col-span-2 space-y-4">
                    
                    <!-- Search & Filter Controls -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                        <div class="flex flex-col sm:flex-row gap-3">
                            <!-- Search Bar -->
                            <div class="relative flex-1">
                                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" id="search-input" placeholder="タスク名やメモを検索..." 
                                    class="w-full pl-9 pr-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                            </div>

                            <!-- Sort Selector -->
                            <div class="w-full sm:w-48">
                                <select id="sort-select" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                                    <option value="created-desc">作成日時 (新しい順)</option>
                                    <option value="created-asc">作成日時 (古い順)</option>
                                    <option value="duedate-asc">期限日 (近い順)</option>
                                    <option value="priority-desc">優先度 (高い順)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Status Filter Buttons -->
                        <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs font-medium">
                            <div class="flex items-center gap-1.5" id="filter-status-group">
                                <span class="text-slate-400 mr-1">絞り込み:</span>
                                <button class="filter-status-btn px-3 py-1 rounded-lg bg-brand-50 text-brand-600 font-semibold border border-brand-200 transition" data-status="all">すべて</button>
                                <button class="filter-status-btn px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-status="active">未完了</button>
                                <button class="filter-status-btn px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-status="completed">完了済み</button>
                            </div>

                            <button id="clear-completed-btn" class="text-slate-400 hover:text-rose-600 transition flex items-center gap-1">
                                <i class="fa-regular fa-trash-can"></i>
                                <span>完了済みを削除</span>
                            </button>
                        </div>
                    </div>

                    <!-- Tasks Listing Container -->
                    <div id="tasks-container" class="space-y-3">
                        <!-- Empty Task List Placeholder -->
                        <div id="tasks-empty" class="hidden py-12 text-center bg-white rounded-2xl border border-slate-200/80 p-6">
                            <i class="fa-regular fa-clipboard text-4xl text-slate-300 mb-3"></i>
                            <h4 class="text-base font-semibold text-slate-700">タスクが見つかりません</h4>
                            <p class="text-sm text-slate-500 mt-1">条件に合うタスクがないか、まだ作成されていません。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Task Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900">タスクの編集</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="edit-task-form" class="space-y-4">
                <input type="hidden" id="edit-task-id">
                
                <div>
                    <label for="edit-task-title" class="block text-xs font-semibold text-slate-600 mb-1">タイトル <span class="text-red-500">*</span></label>
                    <input type="text" id="edit-task-title" required 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                </div>

                <div>
                    <label for="edit-task-desc" class="block text-xs font-semibold text-slate-600 mb-1">詳細メモ (任意)</label>
                    <textarea id="edit-task-desc" rows="3" placeholder="詳細メモ..." 
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="edit-task-priority" class="block text-xs font-semibold text-slate-600 mb-1">優先度</label>
                        <select id="edit-task-priority" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                            <option value="low">低 (Low)</option>
                            <option value="medium">中 (Medium)</option>
                            <option value="high">高 (High)</option>
                        </select>
                    </div>
                    <div>
                        <label for="edit-task-category" class="block text-xs font-semibold text-slate-600 mb-1">カテゴリ</label>
                        <select id="edit-task-category" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                            <option value="work">仕事</option>
                            <option value="personal">個人</option>
                            <option value="study">学習</option>
                            <option value="shopping">買い物</option>
                            <option value="health">健康・運動</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="edit-task-duedate" class="block text-xs font-semibold text-slate-600 mb-1">期限日</label>
                    <input type="date" id="edit-task-duedate" 
                        class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl shadow-sm transition">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Application State & Storage Key
        const STORAGE_KEY = 'taskflow_tasks_app_data';

        let tasks = [];
        let currentFilterStatus = 'all';
        let searchQuery = '';
        let currentSort = 'created-desc';

        // Initial Sample Data (First time user)
        const sampleTasks = [
            {
                id: 'task-sample-1',
                title: 'TaskFlow へようこそ！',
                description: '左側のフォームから新しいタスクを作成できます。チェックを入れて完了にしましょう。',
                priority: 'high',
                category: 'personal',
                dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                completed: false,
                createdAt: Date.now() - 3600000
            },
            {
                id: 'task-sample-2',
                title: 'プロジェクト資料の整理',
                description: '要件定義書とデザインデータのバックアップを取る',
                priority: 'medium',
                category: 'work',
                dueDate: null,
                completed: true,
                createdAt: Date.now() - 7200000
            }
        ];

        // Load & Save Helpers
        function loadTasks() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    tasks = JSON.parse(stored);
                } else {
                    tasks = [...sampleTasks];
                    saveTasks();
                }
            } catch (e) {
                console.warn('LocalStorage error:', e);
                tasks = [...sampleTasks];
            }
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                console.error('Save failed:', e);
            }
        }

        // Toast Messages
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white'
            };

            const icons = {
                success: 'fa-circle-check',
                error: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg font-medium text-sm transition-all transform translate-y-2 opacity-0 pointer-events-auto ${bgColors[type] || bgColors.info}`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info}"></i>
                <span>${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }

        // Render Tasks to UI
        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const emptyState = document.getElementById('tasks-empty');
            if (!container) return;

            // Filter logic
            let filtered = tasks.filter(task => {
                if (currentFilterStatus === 'active' && task.completed) return false;
                if (currentFilterStatus === 'completed' && !task.completed) return false;

                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const matchTitle = task.title.toLowerCase().includes(q);
                    const matchDesc = task.description ? task.description.toLowerCase().includes(q) : false;
                    if (!matchTitle && !matchDesc) return false;
                }
                return true;
            });

            // Sort logic
            filtered.sort((a, b) => {
                if (currentSort === 'created-desc') return b.createdAt - a.createdAt;
                if (currentSort === 'created-asc') return a.createdAt - b.createdAt;
                if (currentSort === 'duedate-asc') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                }
                if (currentSort === 'priority-desc') {
                    const weight = { high: 3, medium: 2, low: 1 };
                    return (weight[b.priority] || 0) - (weight[a.priority] || 0);
                }
                return 0;
            });

            // Render Task Cards
            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState?.classList.remove('hidden');
            } else {
                emptyState?.classList.add('hidden');
            }

            const priorityBadges = {
                high: '<span class="px-2 py-0.5 text-[11px] font-semibold bg-rose-50 text-rose-600 rounded-md border border-rose-200/60">高 (High)</span>',
                medium: '<span class="px-2 py-0.5 text-[11px] font-semibold bg-amber-50 text-amber-600 rounded-md border border-amber-200/60">中 (Medium)</span>',
                low: '<span class="px-2 py-0.5 text-[11px] font-semibold bg-slate-100 text-slate-600 rounded-md border border-slate-200/60">低 (Low)</span>'
            };

            const categoryLabels = {
                work: '<i class="fa-solid fa-briefcase text-blue-500 mr-1"></i> 仕事',
                personal: '<i class="fa-solid fa-user text-purple-500 mr-1"></i> 個人',
                study: '<i class="fa-solid fa-graduation-cap text-emerald-500 mr-1"></i> 学習',
                shopping: '<i class="fa-solid fa-cart-shopping text-amber-500 mr-1"></i> 買い物',
                health: '<i class="fa-solid fa-heart text-rose-500 mr-1"></i> 健康・運動'
            };

            filtered.forEach(task => {
                const card = document.createElement('div');
                card.className = `task-card bg-white p-4 sm:p-5 rounded-2xl border ${task.completed ? 'border-slate-200 bg-slate-50/60' : 'border-slate-200/80 shadow-sm'} flex flex-col sm:flex-row sm:items-center justify-between gap-4`;

                const isOverdue = task.dueDate && !task.completed && new Date(task.dueDate) < new Date().setHours(0,0,0,0);

                card.innerHTML = `
                    <div class="flex items-start gap-3.5 flex-1 min-w-0">
                        <!-- Checkbox -->
                        <button onclick="toggleTaskComplete('${task.id}')" 
                            class="mt-0.5 flex-shrink-0 w-6 h-6 rounded-lg border-2 ${task.completed ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 text-transparent hover:border-brand-500'} flex items-center justify-center transition">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>

                        <div class="space-y-1 flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2">
                                <h4 class="text-base font-semibold ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} break-words">
                                    ${escapeHtml(task.title)}
                                </h4>
                                ${priorityBadges[task.priority] || ''}
                            </div>

                            ${task.description ? `
                                <p class="text-xs text-slate-500 ${task.completed ? 'line-through text-slate-300' : ''} line-clamp-2">
                                    ${escapeHtml(task.description)}
                                </p>
                            ` : ''}

                            <div class="flex flex-wrap items-center gap-3 pt-1 text-xs text-slate-500">
                                <span class="bg-slate-100 px-2 py-0.5 rounded-md font-medium text-slate-600">
                                    ${categoryLabels[task.category] || task.category}
                                </span>

                                ${task.dueDate ? `
                                    <span class="flex items-center gap-1 ${isOverdue ? 'text-rose-600 font-semibold' : ''}">
                                        <i class="fa-regular fa-calendar text-xs"></i>
                                        ${task.dueDate} ${isOverdue ? '(期限切れ)' : ''}
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-1 self-end sm:self-center pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 w-full sm:w-auto justify-end">
                        <button onclick="openEditModal('${task.id}')" class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition" title="編集">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteTask('${task.id}')" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="削除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });

            updateStats();
        }

        // Update Stats Counters
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-rate-text').textContent = `${rate}%`;
            document.getElementById('stat-rate-bar').style.width = `${rate}%`;
        }

        // Add Task Form Handler
        document.getElementById('add-task-form')?.addEventListener('submit', (e) => {
            e.preventDefault();

            const titleInput = document.getElementById('task-title');
            const descInput = document.getElementById('task-desc');
            const priorityInput = document.getElementById('task-priority');
            const categoryInput = document.getElementById('task-category');
            const dueDateInput = document.getElementById('task-duedate');

            const title = titleInput.value.trim();
            if (!title) return;

            const newTask = {
                id: 'task-' + Date.now(),
                title: title,
                description: descInput.value.trim(),
                priority: priorityInput.value,
                category: categoryInput.value,
                dueDate: dueDateInput.value || null,
                completed: false,
                createdAt: Date.now()
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();

            titleInput.value = '';
            descInput.value = '';
            priorityInput.value = 'medium';
            categoryInput.value = 'personal';
            dueDateInput.value = '';

            showToast('タスクを作成しました', 'success');
        });

        // Toggle Task Completion
        window.toggleTaskComplete = function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                showToast(task.completed ? 'タスクを完了しました' : 'タスクを未完了に戻しました', 'info');
            }
        };

        // Delete Task
        window.deleteTask = function(taskId) {
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
            renderTasks();
            showToast('タスクを削除しました', 'info');
        };

        // Clear Completed Tasks
        document.getElementById('clear-completed-btn')?.addEventListener('click', () => {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('完了済みのタスクはありません', 'info');
                return;
            }
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
            showToast(`${completedCount} 件の完了済みタスクを削除しました`, 'success');
        });

        // Edit Modal Controls
        window.openEditModal = function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            document.getElementById('edit-task-id').value = task.id;
            document.getElementById('edit-task-title').value = task.title;
            document.getElementById('edit-task-desc').value = task.description || '';
            document.getElementById('edit-task-priority').value = task.priority;
            document.getElementById('edit-task-category').value = task.category;
            document.getElementById('edit-task-duedate').value = task.dueDate || '';

            document.getElementById('edit-modal')?.classList.remove('hidden');
        };

        function closeEditModal() {
            document.getElementById('edit-modal')?.classList.add('hidden');
        }

        document.getElementById('close-modal-btn')?.addEventListener('click', closeEditModal);
        document.getElementById('cancel-edit-btn')?.addEventListener('click', closeEditModal);

        document.getElementById('edit-task-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const taskId = document.getElementById('edit-task-id').value;
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            task.title = document.getElementById('edit-task-title').value.trim();
            task.description = document.getElementById('edit-task-desc').value.trim();
            task.priority = document.getElementById('edit-task-priority').value;
            task.category = document.getElementById('edit-task-category').value;
            task.dueDate = document.getElementById('edit-task-duedate').value || null;

            saveTasks();
            renderTasks();
            closeEditModal();
            showToast('タスクを更新しました', 'success');
        });

        // Search, Filter, and Sort Listeners
        document.getElementById('search-input')?.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderTasks();
        });

        document.getElementById('sort-select')?.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderTasks();
        });

        document.querySelectorAll('.filter-status-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-status-btn').forEach(b => {
                    b.className = 'filter-status-btn px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
                });
                btn.className = 'filter-status-btn px-3 py-1 rounded-lg bg-brand-50 text-brand-600 font-semibold border border-brand-200 transition';
                currentFilterStatus = btn.dataset.status;
                renderTasks();
            });
        });

        // Export JSON Data
        document.getElementById('export-btn')?.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `taskflow_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('データをファイルに書き出しました', 'success');
        });

        // Import JSON Data
        document.getElementById('import-input')?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        tasks = imported;
                        saveTasks();
                        renderTasks();
                        showToast('データを正常に読み込みました', 'success');
                    } else {
                        showToast('無効なファイル形式です', 'error');
                    }
                } catch (err) {
                    showToast('ファイルの読み込みに失敗しました', 'error');
                }
            };
            reader.readAsText(file);
        });

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderTasks();
        });
    </script>
</body>
</html>
